version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: capstone_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone
    volumes:
      - capstone_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - capstone_network

  redis:
    image: redis:7-alpine
    container_name: capstone_redis
    command: redis-server --appendonly yes
    volumes:
      - capstone_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - capstone_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: capstone_mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - capstone_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone_app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/capstone
      - REDIS_URL=redis://redis:6379
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - MAILPIT_HTTP_PORT=8025
      - MAILPIT_FROM=noreply@widget.local
      - SUBMISSION_MAX_BYTES=51200
      - RATE_LIMIT_MAX=5
      - RATE_LIMIT_WINDOW_MS=30000
      - GEO_PROVIDER_A_URL=http://ip-api.com/json/
      - GEO_PROVIDER_B_URL=https://ipapi.co/json/
      - GEO_TIMEOUT_MS=2000
      - GEO_CIRCUIT_BREAKER_THRESHOLD=3
      - GEO_CIRCUIT_BREAKER_RESET_MS=60000
      - MOCK_GEO_FAILURE_A=false
      - MOCK_GEO_FAILURE_ALL=false
      - WIDGET_CONFIG_CACHE_MAX_AGE=60
      - WIDGET_JS_CACHE_MAX_AGE=31536000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - capstone_network

volumes:
  capstone_pgdata:
  capstone_redisdata:

networks:
  capstone_network:
    driver: bridge