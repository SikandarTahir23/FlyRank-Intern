# Probe Requirements Mapping
probes:
  1:
    name: "Multi-Origin Submissions"
    requirement: "Accept submissions from any origin via CORS"
    test: "POST /api/submissions with Origin header → 201 + Access-Control-Allow-Origin: *"
    
  2:
    name: "Payload Size Limit"
    requirement: "Reject payloads > 50KB with 413"
    test: "POST /api/submissions with 60KB body → 413 PAYLOAD_TOO_LARGE"
    
  3:
    name: "Rate Limit Burst"
    requirement: "Limit to 5 req/30s per IP per widget, return 429"
    test: "6 rapid POSTs → first 5 = 201, 6th = 429 with Retry-After"
    
  4:
    name: "Geo Fallback Tolerance"
    requirement: "Provider A → Provider B → NullGeo fallback chain"
    test: "Submit with geo providers failing → still 201, geo in response"
    
  5:
    name: "Failing Side-Effect Isolation"
    requirement: "Email/notification failures don't affect 201 response"
    test: "Submit with Mailpit down → still 201, submission persisted"
    
  6:
    name: "Honeypot Trapping"
    requirement: "Hidden field detection marks spam, returns 201"
    test: "POST with honeypot field filled → 201, DB is_spam=true"