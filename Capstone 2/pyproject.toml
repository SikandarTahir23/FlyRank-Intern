[project]
name = "capstone-image-matching"
version = "0.1.0"
description = "AI Image Understanding & Content Matching Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.3",
    "google-generativeai>=0.7.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.0",
]
optional-dependencies = {
    "dev": [
        "pytest>=8.0.0",
        "pytest-asyncio>=0.23.0",
        "pytest-cov>=4.1.0",
        "httpx>=0.26.0",
        "ruff>=0.3.0",
        "mypy>=1.8.0",
    ],
    "local-ai": [
        "ollama>=0.3.0",
    ]
}

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "B", "C4", "T20"]
ignore = ["E501", "B008"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["eval"]
python_files = ["probe_*.py", "test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]