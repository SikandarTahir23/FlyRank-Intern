services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: capstone-postgres
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    environment:
      DATABASE_URL: postgresql://capstone:capstone@postgres:5432/capstone
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      COSINE_THRESHOLD: 0.72
      CONFIDENCE_THRESHOLD: 0.75
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/images:/app/data/images:ro

volumes:
  postgres_data: